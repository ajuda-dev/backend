      summary: Remove skill do perfil do usuário
      tags:
      - skill_users
  /v1/user/forgot-password:
    post:
      consumes:
      - application/json
      description: Sempre responde 204. Se o e-mail existir e tiver senha, envia um
        código de 6 caracteres por e-mail. Não revela se a conta existe. Rate limit
        por e-mail (429).
      parameters:
      - description: E-mail da conta
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.ForgotPasswordDtoIn'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties: true
            type: object
      summary: Solicita recuperação de senha
      tags:
      - users
  /v1/user/login:
    post:
      consumes:
      - application/json
      description: 'Realiza o login e grava o token JWT em um cookie de sessão HttpOnly
        (ajudadev_session), enviado automaticamente pelo navegador nas próximas requisições.
        Clientes nativos informam o header X-Client-Type: native e recebem o token
        também no corpo da resposta, para guardar em secure storage e usar via Authorization:
        Bearer.'
      parameters:
      - description: Credenciais do usuário
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/dto.LoginUserDtoIn'
      - description: Informe 'native' (apps mobile/desktop) para receber o token JWT
          no corpo da resposta
        in: header
        name: X-Client-Type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginUserDtoOut'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Autentica um usuário
      tags:
      - users
  /v1/user/logout:
    post:
      description: 'Limpa o cookie HttpOnly de sessão. Endpoint público e idempotente:
        precisa responder mesmo com a sessão já expirada, para que o navegador pare
        de enviar o cookie.'
      responses:
        "204":
          description: No Content
      summary: Encerra a sessão (logout)
      tags:
      - users
  /v1/user/me:
    get:
      description: 'Devolve id, name, email, role e emailVerified do usuário da sessão
        atual (cookie de sessão ou Authorization: Bearer). Usado pelo frontend no
        boot para restaurar a sessão sem guardar o token no navegador.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserDtoOut'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Retorna o usuário autenticado
      tags:
      - users
  /v1/user/register:
    post:
      consumes:
      - application/json
      description: 'Cria um novo usuário com e-mail ainda não confirmado (emailVerified
        false) e grava o token JWT em um cookie de sessão HttpOnly (ajudadev_session),
        enviado automaticamente pelo navegador nas próximas requisições. O worker
        da outbox envia o código de confirmação. Clientes nativos informam o header
        X-Client-Type: native e recebem o token também no corpo da resposta, para
        guardar em secure storage e usar via Authorization: Bearer.'
      parameters:
      - description: Dados do usuário
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterUserDtoIn'
      - description: Informe 'native' (apps mobile/desktop) para receber o token JWT
          no corpo da resposta
        in: header
        name: X-Client-Type
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.UserDtoOut'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Registra um novo usuário
      tags:
      - users
  /v1/user/resend-verification:
    post:
      description: Se o e-mail ainda não foi confirmado, enfileira um novo evento
        CREATED_ACCOUNT na outbox. Sempre 204 quando a conta já está verificada. Rate
        limit de envios → 429.
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Reenvia o código de confirmação de e-mail
      tags:
      - users
  /v1/user/reset-password:
    post:
      consumes:
      - application/json
      description: Valida o código HMAC (sem persistir código) e grava o novo hash
        bcrypt. Código inválido/expirado ou conta OAuth sem senha → 401 genérico.
        Rate limit de tentativas → 429.
      parameters:
      - description: E-mail, código e nova senha
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.ResetPasswordDtoIn'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties: true
            type: object
      summary: Redefine a senha com o código recebido por e-mail
      tags:
      - users
  /v1/user/verify-email:
    post:
      consumes:
      - application/json
      description: Valida o código de 6 caracteres (0-9A-Z) enviado no cadastro. Sucesso
        preenche email_verified_at e devolve o usuário com emailVerified true. Código
        inválido/expirado → 401. Rate limit de tentativas → 429.
      parameters:
      - description: Código de confirmação
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.VerifyEmailDtoIn'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserDtoOut'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Confirma o e-mail com o código recebido
      tags:
      - users
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
