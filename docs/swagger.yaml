info:
  contact: {}
  description: 'Sessão por cookie HttpOnly (ajudadev_session): login, registro e callback
    OAuth gravam o cookie e o navegador o envia sozinho — o JavaScript nunca lê o
    token. Apps nativos usam Authorization: Bearer com o token obtido via header X-Client-Type:
    native no login/registro.'
  title: AjudaDev Backend API
  version: "1.0"
paths:
  /v1/address:
    get:
      consumes:
      - application/json
      description: Retorna os endereços com paginação e filtros opcionais por cidade
        (busca parcial, case-insensitive e accent-insensitive), estado (UF exata)
        e CEP (igualdade pelos dígitos, aceita com ou sem hífen)
      parameters:
      - description: Página
        in: query
        name: page
        type: integer
      - description: Limite
        in: query
        name: limit
        type: integer
      - description: Cidade (busca parcial, case-insensitive, ignora acentos)
        in: query
        name: city
        type: string
      - description: UF (igualdade exata, ex. SP)
        in: query
        name: state
        type: string
      - description: CEP (igualdade pelos dígitos, aceita com ou sem hífen)
        in: query
        name: zip_code
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PageableAddressDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Lista endereços
      tags:
      - addresses
  /v1/address/register:
    post:
      consumes:
      - application/json
      description: Cria um novo endereço no sistema
      parameters:
      - description: Dados do endereço
        in: body
        name: address
        required: true
        schema:
          $ref: '#/definitions/dto.AddressDto'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.AddressDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Registra um novo endereço
      tags:
      - addresses
  /v1/auth/{provider}/callback:
    get:
      description: Recebe o code do provedor, autentica o usuário (reaproveitando
        o vínculo existente, casando pelo e-mail verificado ou criando um usuário
        novo sem senha) e grava o token JWT em cookie de sessão HttpOnly (ajudadev_session)
        antes de redirecionar para o frontend — o token não trafega na URL. Em falha,
        redireciona para o frontend com ?error=auth_failed. Endpoint público.
      parameters:
      - description: 'Provedor OAuth (ex.: github)'
        in: path
        name: provider
        required: true
        type: string
      - description: Código de autorização devolvido pelo provedor
        in: query
        name: code
        required: true
        type: string
      - description: State enviado no início do fluxo
        in: query
        name: state
        required: true
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Redireciona para o frontend com o cookie de sessão gravado
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Callback do login via OAuth
      tags:
      - auth
  /v1/auth/{provider}/login:
    get:
      description: 'Redireciona o navegador para o provedor OAuth informado no path
        (ex.: github). Endpoint público: é o início do fluxo de login. O state é gravado
        em cookie HttpOnly de curta duração e conferido no callback.'
      parameters:
      - description: 'Provedor OAuth (ex.: github)'
        in: path
        name: provider
        required: true
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Redireciona para a página de autorização do provedor
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Inicia o login via OAuth
      tags:
      - auth
  /v1/community:
    get:
      consumes:
      - application/json
      description: Retorna todas as comunidades, com paginação e filtros por dono,
        nome e cidade (buscas parciais, case-insensitive e accent-insensitive)
      parameters:
      - description: Página
        in: query
        name: page
        type: integer
      - description: Limite
        in: query
        name: limit
        type: integer
      - description: ID do dono da comunidade (uuid v7)
        in: query
        name: owner_id
        type: string
      - description: Nome da comunidade (busca parcial, case-insensitive, ignora acentos)
        in: query
        name: name
        type: string
      - description: Cidade do endereço da comunidade (busca parcial, case-insensitive,
          ignora acentos)
        in: query
        name: city
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PageableCommunityDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Lista comunidades
      tags:
      - communities
  /v1/community/{id}:
    delete:
      description: Arquiva a comunidade marcando deleted_at. Somente o owner pode
        deletar a própria comunidade (usuários comuns); moderadores e admins podem
        deletar qualquer comunidade. Comunidade com membros ativos não pode ser deletada.
      parameters:
      - description: ID da comunidade
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Remove comunidade (soft delete)
      tags:
      - communities
    get:
      consumes:
      - application/json
      description: Retorna o detalhe da comunidade com owner e endereço (preloads)
      parameters:
      - description: ID da comunidade
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CommunityDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Busca comunidade por id
      tags:
      - communities
    put:
      consumes:
      - application/json
      description: Atualiza nome, descrição e/ou endereço (campos vazios são ignorados).
        Somente o dono da comunidade, moderadores e admins.
      parameters:
      - description: ID da comunidade
        in: path
        name: id
        required: true
        type: string
      - description: Campos a alterar
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateCommunityDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CommunityDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Altera uma comunidade
      tags:
      - communities
  /v1/community/{id}/join:
    post:
      consumes:
      - application/json
      description: 'Associa o usuário autenticado (do token) à comunidade como membro.
        A linha é única por (comunidade, usuário): tentar entrar de novo gera erro.
        O owner não possui linha própria de membership.'
      parameters:
      - description: ID da comunidade
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.CommunityUserDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Entra em uma comunidade
      tags:
      - community_users
  /v1/community/{id}/leave:
    delete:
      consumes:
      - application/json
      description: 'Remove fisicamente a linha de membership do usuário autenticado
        na comunidade. O owner não é membro da própria comunidade: tentar sair dela
        retorna 404.'
      parameters:
      - description: ID da comunidade
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Sai de uma comunidade
      tags:
      - community_users
  /v1/community/{id}/members:
    get:
      consumes:
      - application/json
      description: Retorna os membros de uma comunidade (linhas de community_users)
        com o usuário resumido, paginados em ordem alfabética pelo nome. O dono não
        aparece (não possui membership). Usuários sem e-mail compartilhado não expõem
        e-mail.
      parameters:
      - description: ID da comunidade
        in: path
        name: id
        required: true
        type: string
      - description: Página
        in: query
        name: page
        type: integer
      - description: Limite
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PageableCommunityMemberDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Lista membros da comunidade
      tags:
      - community_users
  /v1/community/register:
    post:
      consumes:
      - application/json
      description: Cria uma nova comunidade no sistema. O owner é sempre o usuário
        autenticado (owner_id do body é ignorado)
      parameters:
      - description: Dados da comunidade
        in: body
        name: community
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterCommunityDto'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.CommunityDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Registra uma nova comunidade
      tags:
      - communities
  /v1/event:
    get:
      consumes:
      - application/json
      description: Retorna todos os eventos, com paginação e filtros por comunidade,
        categoria, tipo, endereço, cidade e apenas futuros
      parameters:
      - description: Página
        in: query
        name: page
        type: integer
      - description: Limite
        in: query
        name: limit
        type: integer
      - description: ID da comunidade
        in: query
        name: community_id
        type: string
      - description: Categoria (COMMUNITY_EVENT, MENTORING, WEBINAR)
        in: query
        name: category
        type: string
      - description: Formato (ONLINE, INPERSON, HYBRID)
        in: query
        name: type
        type: string
      - description: ID do endereço
        in: query
        name: address_id
        type: string
      - description: Cidade do endereço do evento
        in: query
        name: city
        type: string
      - description: Somente eventos futuros
        in: query
        name: upcoming
        type: boolean
      - description: 'ID do usuário (agenda: eventos com participação)'
        in: query
        name: user_id
        type: string
      - description: Papel da participação (com user_id)
        in: query
        name: role
        type: string
      - description: Status da participação (com user_id)
        in: query
        name: status
        type: string
      - description: Status de aprovação do evento (PENDING, APPROVED, REJECTED) —
          apenas dono da comunidade ou staff
        in: query
        name: approval_status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PageableEventDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Lista eventos
      tags:
      - events
  /v1/event/{eventId}/join:
    post:
      consumes:
      - application/json
      description: 'Inscreve o usuário como ATTENDEE em um evento COMMUNITY_EVENT
        ou WEBINAR, respeitando MaxSlots. A linha é única por (evento, usuário): cancelamentos
        viram CANCELLED e uma nova inscrição reativa a linha.'
      parameters:
      - description: ID do evento
        in: path
        name: eventId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.EventUserDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
