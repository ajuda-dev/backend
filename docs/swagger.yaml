info:
  contact: {}
paths:
  /v1/address/register:
    post:
      consumes:
      - application/json
      description: Cria um novo endereço no sistema
      parameters:
      - description: Dados do endereço
        in: body
        name: address
        required: true
        schema:
          $ref: '#/definitions/github_com_ajuda-dev_backend_src_controller_dto.AddressDto'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_ajuda-dev_backend_src_controller_dto.AddressDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Registra um novo endereço
      tags:
      - addresses
  /v1/community:
    get:
      consumes:
      - application/json
      description: Retorna todas as comunidades, com paginação e filtro por endereço
      parameters:
      - description: Página
        in: query
        name: page
        type: integer
      - description: Limite
        in: query
        name: limit
        type: integer
      - description: ID do endereço
        in: query
        name: address_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ajuda-dev_backend_src_controller_dto.PageableCommunityDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Lista comunidades
      tags:
      - communities
  /v1/community/register:
    post:
      consumes:
      - application/json
      description: Cria uma nova comunidade no sistema
      parameters:
      - description: Dados da comunidade
        in: body
        name: community
        required: true
        schema:
          $ref: '#/definitions/github_com_ajuda-dev_backend_src_controller_dto.RegisterCommunityDto'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_ajuda-dev_backend_src_controller_dto.RegisterCommunityDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Registra uma nova comunidade
      tags:
      - communities
  /v1/event:
    get:
      consumes:
      - application/json
      description: Retorna todos os eventos, com paginação e filtros por comunidade,
        categoria, tipo, endereço, cidade e apenas futuros
      parameters:
      - description: Página
        in: query
        name: page
        type: integer
      - description: Limite
        in: query
        name: limit
        type: integer
      - description: ID da comunidade
        in: query
        name: community_id
        type: string
      - description: Categoria (COMMUNITY_EVENT, MENTORING, WEBINAR)
        in: query
        name: category
        type: string
      - description: Formato (ONLINE, INPERSON, HYBRID)
        in: query
        name: type
        type: string
      - description: ID do endereço
        in: query
        name: address_id
        type: string
      - description: Cidade do endereço do evento
        in: query
        name: city
        type: string
      - description: Somente eventos futuros
        in: query
        name: upcoming
        type: boolean
      - description: 'ID do usuário (agenda: eventos com participação)'
        in: query
        name: user_id
        type: string
      - description: Papel da participação (com user_id)
        in: query
        name: role
        type: string
      - description: Status da participação (com user_id)
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ajuda-dev_backend_src_controller_dto.PageableEventDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Lista eventos
      tags:
      - events
  /v1/event/{eventId}/join:
    post:
      consumes:
      - application/json
      description: 'Inscreve o usuário como ATTENDEE em um evento COMMUNITY_EVENT
        ou WEBINAR, respeitando MaxSlots. A linha é única por (evento, usuário): cancelamentos
        viram CANCELLED e uma nova inscrição reativa a linha.'
      parameters:
      - description: ID do evento
        in: path
        name: eventId
        required: true
        type: string
      - description: Dados da inscrição
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_ajuda-dev_backend_src_controller_dto.JoinEventDto'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_ajuda-dev_backend_src_controller_dto.EventUserDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Auto-inscreve um participante
      tags:
      - event_users
  /v1/event/{eventId}/participants:
    get:
      consumes:
      - application/json
      description: Retorna os participantes do evento com usuário (preload), com filtro
        opcional de status
      parameters:
      - description: ID do evento
        in: path
        name: eventId
        required: true
        type: string
      - description: Filtro por status (REQUESTED, CONFIRMED, REJECTED, CANCELLED)
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_ajuda-dev_backend_src_controller_dto.EventUserDto'
            type: array
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Lista participantes do evento
      tags:
      - event_users
    post:
      consumes:
      - application/json
      description: O host adiciona um MENTEE (status REQUESTED) em eventos MENTORING
        ou um SPEAKER (status CONFIRMED) em eventos COMMUNITY_EVENT/WEBINAR.
      parameters:
      - description: ID do evento
        in: path
        name: eventId
        required: true
        type: string
      - description: Dados do participante
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_ajuda-dev_backend_src_controller_dto.AddParticipantDto'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_ajuda-dev_backend_src_controller_dto.EventUserDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Adiciona participante (MENTEE ou SPEAKER)
      tags:
      - event_users
  /v1/event/{eventId}/participants/{userId}:
    delete:
      consumes:
      - application/json
      description: 'Não deleta a linha: o status vira CANCELLED. Reinscrever depois
        volta a mesma linha para CONFIRMED.'
      parameters:
      - description: ID do evento
        in: path
        name: eventId
        required: true
        type: string
      - description: ID do usuário
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ajuda-dev_backend_src_controller_dto.EventUserDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Cancela participação (desistência)
      tags:
      - event_users
  /v1/event/{eventId}/participants/{userId}/status:
    put:
      consumes:
      - application/json
      description: MENTEE aceita (CONFIRMED) ou recusa (REJECTED) o convite de mentoria.
        Garante no máximo 1 MENTEE CONFIRMED por evento MENTORING.
      parameters:
      - description: ID do evento
        in: path
        name: eventId
        required: true
        type: string
      - description: ID do usuário
        in: path
        name: userId
        required: true
        type: string
      - description: Novo status (CONFIRMED ou REJECTED)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_ajuda-dev_backend_src_controller_dto.UpdateParticipantStatusDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ajuda-dev_backend_src_controller_dto.EventUserDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Atualiza status do participante
      tags:
      - event_users
  /v1/event/{id}:
    delete:
      description: Arquiva o evento marcando deleted_at
      parameters:
      - description: ID do evento
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Remove evento (soft delete)
      tags:
      - events
    get:
      consumes:
      - application/json
      description: Retorna o detalhe do evento com owner, endereço e comunidade (preloads)
      parameters:
      - description: ID do evento
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ajuda-dev_backend_src_controller_dto.EventDto'
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Busca evento por id
      tags:
      - events
  /v1/event/register:
    post:
      consumes:
      - application/json
      description: Cria um novo evento no sistema. Para eventos INPERSON/HYBRID, address_id
        é obrigatório; para ONLINE, address_id deve ser nulo.
      parameters:
      - description: Dados do evento
        in: body
        name: event
        required: true
        schema:
          $ref: '#/definitions/github_com_ajuda-dev_backend_src_controller_dto.RegisterEventDto'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_ajuda-dev_backend_src_controller_dto.RegisterEventDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Registra um novo evento
      tags:
      - events
  /v1/skill:
    get:
      consumes:
      - application/json
      description: 'Retorna as skills com paginação e busca por prefixo do nome (case
        insensitive: o termo é normalizado para caixa alta antes do LIKE)'
      parameters:
      - description: Prefixo do nome da skill
        in: query
        name: name
        type: string
      - description: Página
        in: query
        name: page
        type: integer
      - description: Limite
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ajuda-dev_backend_src_controller_dto.PageableSkillDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Lista skills do catálogo
      tags:
      - skills
  /v1/skill/{id}:
    delete:
      description: Arquiva a skill marcando deleted_at e remove as associações skill_users
        dela (a skill some do perfil de todos os usuários)
      parameters:
      - description: ID da skill
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Remove skill (soft delete)
      tags:
      - skills
    get:
      consumes:
      - application/json
      description: Retorna o detalhe da skill
      parameters:
      - description: ID da skill
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ajuda-dev_backend_src_controller_dto.SkillDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Busca skill por id
      tags:
      - skills
    put:
      consumes:
      - application/json
      description: Atualiza o nome da skill (normalizado para caixa alta). Nome já
        usado por outra skill ativa gera conflito.
      parameters:
      - description: ID da skill
        in: path
        name: id
        required: true
        type: string
      - description: Novo nome da skill
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_ajuda-dev_backend_src_controller_dto.UpdateSkillDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ajuda-dev_backend_src_controller_dto.RegisterSkillDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Renomeia uma skill
      tags:
      - skills
  /v1/skill/{skillId}/users:
    post:
      consumes:
      - application/json
      description: 'Associa uma skill do catálogo a um usuário com um nível (WANT_TO_LEARN,
        LEARN_AND_TEACH ou TEACH). A linha é única por (skill, usuário): tentar associar
        de novo gera erro.'
      parameters:
      - description: ID da skill
        in: path
        name: skillId
        required: true
        type: string
      - description: Dados da associação
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_ajuda-dev_backend_src_controller_dto.AssignSkillDto'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_ajuda-dev_backend_src_controller_dto.SkillUserDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Adiciona skill ao perfil do usuário
      tags:
      - skill_users
  /v1/skill/register:
    post:
      consumes:
      - application/json
      description: Cria uma skill no catálogo. O nome é salvo em caixa alta (normalizado)
        e é único entre skills ativas.
      parameters:
      - description: Dados da skill
        in: body
        name: skill
        required: true
        schema:
          $ref: '#/definitions/github_com_ajuda-dev_backend_src_controller_dto.RegisterSkillDto'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_ajuda-dev_backend_src_controller_dto.RegisterSkillDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Registra uma nova skill
      tags:
      - skills
  /v1/user:
    get:
      consumes:
      - application/json
      description: Retorna os usuários ativos que possuem a skill informada (match
        exato do nome, normalizado para caixa alta) com as skills do perfil de cada
        um. O parâmetro skill é obrigatório.
      parameters:
      - description: Nome da skill (normalizado para caixa alta)
        in: query
        name: skill
        required: true
        type: string
      - description: Página
        in: query
        name: page
        type: integer
      - description: Limite
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ajuda-dev_backend_src_controller_dto.PageableUserDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Busca usuários por skill
      tags:
      - users
  /v1/user/{userId}/skills:
    get:
      consumes:
      - application/json
      description: Retorna as skills ativas do usuário (com nível), em ordem alfabética.
        Usuário válido sem skills retorna lista vazia.
      parameters:
      - description: ID do usuário
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_ajuda-dev_backend_src_controller_dto.SkillUserDto'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
