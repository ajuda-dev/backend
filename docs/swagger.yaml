definitions:
  dto.AddParticipantDto:
    properties:
      role:
        type: string
      user_id:
        type: string
    type: object
  dto.AddressDto:
    properties:
      city:
        type: string
      complement:
        type: string
      id:
        type: string
      number:
        type: string
      state:
        type: string
      street:
        type: string
      zip_code:
        type: string
    type: object
  dto.AssignSkillDto:
    properties:
      level:
        type: string
      user_id:
        type: string
    type: object
  dto.CommunityDto:
    properties:
      address:
        $ref: '#/definitions/dto.AddressDto'
      description:
        type: string
      id:
        type: string
      name:
        type: string
      owner:
        $ref: '#/definitions/dto.UserDtoOut'
    type: object
  dto.CommunityUserDto:
    properties:
      community_id:
        type: string
      id:
        type: string
      user_id:
        type: string
    type: object
  dto.ConfigVisibilityDto:
    additionalProperties:
      $ref: '#/definitions/dto.VisibilityConfigDto'
    type: object
  dto.EventDto:
    properties:
      address:
        $ref: '#/definitions/dto.AddressDto'
      category:
        type: string
      community:
        $ref: '#/definitions/dto.CommunityDto'
      description:
        type: string
      duration_min:
        type: integer
      id:
        type: string
      max_slots:
        type: integer
      meeting_link:
        type: string
      owner:
        $ref: '#/definitions/dto.UserDtoOut'
      start_at:
        type: string
      title:
        type: string
      type:
        type: string
    type: object
  dto.EventParticipantDto:
    properties:
      event_id:
        type: string
      id:
        type: string
      role:
        type: string
      status:
        type: string
      user:
        $ref: '#/definitions/dto.ParticipantUserDto'
      user_id:
        type: string
    type: object
  dto.EventUserDto:
    properties:
      event_id:
        type: string
      id:
        type: string
      role:
        type: string
      status:
        type: string
      user:
        $ref: '#/definitions/dto.UserDtoOut'
      user_id:
        type: string
    type: object
  dto.LoginUserDtoIn:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  dto.LoginUserDtoOut:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      role:
        type: string
      token:
        type: string
    type: object
  dto.PageableAddressDto:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.AddressDto'
        type: array
      has_next:
        type: boolean
    type: object
  dto.PageableCommunityDto:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.CommunityDto'
        type: array
      has_next:
        type: boolean
    type: object
  dto.PageableEventDto:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.EventDto'
        type: array
      has_next:
        type: boolean
    type: object
  dto.PageableSkillDto:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.SkillDto'
        type: array
      has_next:
        type: boolean
    type: object
  dto.PageableUserDto:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.UserSkillDto'
        type: array
      has_next:
        type: boolean
    type: object
  dto.ParticipantUserDto:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  dto.RegisterCommunityDto:
    properties:
      address_id:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      owner_id:
        type: string
    type: object
  dto.RegisterEventDto:
    properties:
      address_id:
        type: string
      category:
        type: string
      community_id:
        type: string
      description:
        type: string
      duration_min:
        type: integer
      id:
        type: string
      max_slots:
        type: integer
      meeting_link:
        type: string
      owner_id:
        type: string
      start_at:
        type: string
      title:
        type: string
      type:
        type: string
    type: object
  dto.RegisterSkillDto:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  dto.RegisterUserDtoIn:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  dto.SkillDto:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  dto.SkillUserDto:
    properties:
      id:
        type: string
      level:
        type: string
      skill:
        $ref: '#/definitions/dto.SkillDto'
      skill_id:
        type: string
      user_id:
        type: string
    type: object
  dto.UpdateCommunityDto:
    properties:
      address_id:
        type: string
      description:
        type: string
      name:
        type: string
    type: object
  dto.UpdateParticipantStatusDto:
    properties:
      status:
        type: string
    type: object
  dto.UpdateSkillDto:
    properties:
      name:
        type: string
    type: object
  dto.UpdateUserDtoIn:
    properties:
      configVisibility:
        $ref: '#/definitions/dto.ConfigVisibilityDto'
      description:
        type: string
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  dto.UserDtoOut:
    properties:
      configVisibility:
        $ref: '#/definitions/dto.ConfigVisibilityDto'
      description:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      role:
        type: string
      token:
        type: string
    type: object
  dto.UserProfileDtoOut:
    properties:
      configVisibility:
        $ref: '#/definitions/dto.ConfigVisibilityDto'
      description:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  dto.UserSkillDto:
    properties:
      id:
        type: string
      name:
        type: string
      skills:
        items:
          $ref: '#/definitions/dto.SkillDto'
        type: array
    type: object
  dto.VisibilityConfigDto:
    properties:
      shareWithCommunity:
        type: boolean
      value:
        type: string
    type: object
info:
  contact: {}
  title: AjudaDev Backend API
  version: "1.0"
paths:
  /v1/address:
    get:
      consumes:
      - application/json
      description: Retorna os endereços com paginação e filtros opcionais por cidade
        (busca parcial, case-insensitive e accent-insensitive), estado (UF exata)
        e CEP (igualdade pelos dígitos, aceita com ou sem hífen)
      parameters:
      - description: Página
        in: query
        name: page
        type: integer
      - description: Limite
        in: query
        name: limit
        type: integer
      - description: Cidade (busca parcial, case-insensitive, ignora acentos)
        in: query
        name: city
        type: string
      - description: UF (igualdade exata, ex. SP)
        in: query
        name: state
        type: string
      - description: CEP (igualdade pelos dígitos, aceita com ou sem hífen)
        in: query
        name: zip_code
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PageableAddressDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Lista endereços
      tags:
      - addresses
  /v1/address/register:
    post:
      consumes:
      - application/json
      description: Cria um novo endereço no sistema
      parameters:
      - description: Dados do endereço
        in: body
        name: address
        required: true
        schema:
          $ref: '#/definitions/dto.AddressDto'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.AddressDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Registra um novo endereço
      tags:
      - addresses
  /v1/community:
    get:
      consumes:
      - application/json
      description: Retorna todas as comunidades, com paginação e filtros por dono,
        nome e cidade (buscas parciais, case-insensitive e accent-insensitive)
      parameters:
      - description: Página
        in: query
        name: page
        type: integer
      - description: Limite
        in: query
        name: limit
        type: integer
      - description: ID do dono da comunidade (uuid v7)
        in: query
        name: owner_id
        type: string
      - description: Nome da comunidade (busca parcial, case-insensitive, ignora acentos)
        in: query
        name: name
        type: string
      - description: Cidade do endereço da comunidade (busca parcial, case-insensitive,
          ignora acentos)
        in: query
        name: city
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PageableCommunityDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Lista comunidades
      tags:
      - communities
  /v1/community/{id}:
    delete:
      description: Arquiva a comunidade marcando deleted_at. Somente o owner pode
        deletar a própria comunidade (usuários comuns); moderadores e admins podem
        deletar qualquer comunidade. Comunidade com membros ativos não pode ser deletada.
      parameters:
      - description: ID da comunidade
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Remove comunidade (soft delete)
      tags:
      - communities
    get:
      consumes:
      - application/json
      description: Retorna o detalhe da comunidade com owner e endereço (preloads)
      parameters:
      - description: ID da comunidade
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CommunityDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Busca comunidade por id
      tags:
      - communities
    put:
      consumes:
      - application/json
      description: Atualiza nome, descrição e/ou endereço (campos vazios são ignorados).
        Somente o dono da comunidade, moderadores e admins.
      parameters:
      - description: ID da comunidade
        in: path
        name: id
        required: true
        type: string
      - description: Campos a alterar
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateCommunityDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CommunityDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Altera uma comunidade
      tags:
      - communities
  /v1/community/{id}/join:
    post:
      consumes:
      - application/json
      description: 'Associa o usuário autenticado (do token) à comunidade como membro.
        A linha é única por (comunidade, usuário): tentar entrar de novo gera erro.
        O owner não possui linha própria de membership.'
      parameters:
      - description: ID da comunidade
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.CommunityUserDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Entra em uma comunidade
      tags:
      - community_users
  /v1/community/{id}/leave:
    delete:
      consumes:
      - application/json
      description: 'Remove fisicamente a linha de membership do usuário autenticado
        na comunidade. O owner não é membro da própria comunidade: tentar sair dela
        retorna 404.'
      parameters:
      - description: ID da comunidade
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Sai de uma comunidade
      tags:
      - community_users
  /v1/community/register:
    post:
      consumes:
      - application/json
      description: Cria uma nova comunidade no sistema. O owner é sempre o usuário
        autenticado (owner_id do body é ignorado)
      parameters:
      - description: Dados da comunidade
        in: body
        name: community
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterCommunityDto'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.CommunityDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Registra uma nova comunidade
      tags:
      - communities
  /v1/event:
    get:
      consumes:
      - application/json
      description: Retorna todos os eventos, com paginação e filtros por comunidade,
        categoria, tipo, endereço, cidade e apenas futuros
      parameters:
      - description: Página
        in: query
        name: page
        type: integer
      - description: Limite
        in: query
        name: limit
        type: integer
      - description: ID da comunidade
        in: query
        name: community_id
        type: string
      - description: Categoria (COMMUNITY_EVENT, MENTORING, WEBINAR)
        in: query
        name: category
        type: string
      - description: Formato (ONLINE, INPERSON, HYBRID)
        in: query
        name: type
        type: string
      - description: ID do endereço
        in: query
        name: address_id
        type: string
      - description: Cidade do endereço do evento
        in: query
        name: city
        type: string
      - description: Somente eventos futuros
        in: query
        name: upcoming
        type: boolean
      - description: 'ID do usuário (agenda: eventos com participação)'
        in: query
        name: user_id
        type: string
      - description: Papel da participação (com user_id)
        in: query
        name: role
        type: string
      - description: Status da participação (com user_id)
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PageableEventDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Lista eventos
      tags:
      - events
  /v1/event/{eventId}/join:
    post:
      consumes:
      - application/json
      description: 'Inscreve o usuário como ATTENDEE em um evento COMMUNITY_EVENT
        ou WEBINAR, respeitando MaxSlots. A linha é única por (evento, usuário): cancelamentos
        viram CANCELLED e uma nova inscrição reativa a linha.'
      parameters:
      - description: ID do evento
        in: path
        name: eventId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.EventUserDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Auto-inscreve um participante
      tags:
      - event_users
  /v1/event/{eventId}/participants:
    get:
      consumes:
      - application/json
      description: Retorna os participantes do evento com usuário (preload), com filtro
        opcional de status
      parameters:
      - description: ID do evento
        in: path
        name: eventId
        required: true
        type: string
      - description: Filtro por status (REQUESTED, CONFIRMED, REJECTED, CANCELLED)
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.EventParticipantDto'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Lista participantes do evento
      tags:
      - event_users
    post:
      consumes:
      - application/json
      description: O host adiciona um MENTEE (status REQUESTED) em eventos MENTORING
        ou um SPEAKER (status CONFIRMED) em eventos COMMUNITY_EVENT/WEBINAR.
      parameters:
      - description: ID do evento
        in: path
        name: eventId
        required: true
        type: string
      - description: Dados do participante
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.AddParticipantDto'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.EventUserDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Adiciona participante (MENTEE ou SPEAKER)
      tags:
      - event_users
  /v1/event/{eventId}/participants/{userId}:
    delete:
      consumes:
      - application/json
      description: 'Não deleta a linha: o status vira CANCELLED. Reinscrever depois
        volta a mesma linha para CONFIRMED.'
      parameters:
      - description: ID do evento
        in: path
        name: eventId
        required: true
        type: string
      - description: ID do usuário
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.EventUserDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Cancela participação (desistência)
      tags:
      - event_users
  /v1/event/{eventId}/participants/{userId}/status:
    put:
      consumes:
      - application/json
      description: MENTEE aceita (CONFIRMED) ou recusa (REJECTED) o convite de mentoria.
        Garante no máximo 1 MENTEE CONFIRMED por evento MENTORING.
      parameters:
      - description: ID do evento
        in: path
        name: eventId
        required: true
        type: string
      - description: ID do usuário
        in: path
        name: userId
        required: true
        type: string
      - description: Novo status (CONFIRMED ou REJECTED)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateParticipantStatusDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.EventUserDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Atualiza status do participante
      tags:
      - event_users
  /v1/event/{id}:
    delete:
      description: Arquiva o evento marcando deleted_at
      parameters:
      - description: ID do evento
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Remove evento (soft delete)
      tags:
      - events
    get:
      consumes:
      - application/json
      description: Retorna o detalhe do evento com owner, endereço e comunidade (preloads)
      parameters:
      - description: ID do evento
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.EventDto'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Busca evento por id
      tags:
      - events
  /v1/event/register:
    post:
      consumes:
      - application/json
      description: Cria um novo evento no sistema. Para eventos INPERSON/HYBRID, address_id
        é obrigatório; para ONLINE, address_id deve ser nulo. O owner é sempre o usuário
        autenticado (owner_id do body é ignorado)
      parameters:
      - description: Dados do evento
        in: body
        name: event
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterEventDto'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.RegisterEventDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Registra um novo evento
      tags:
      - events
  /v1/skill:
    get:
      consumes:
      - application/json
      description: 'Retorna as skills com paginação e busca por prefixo do nome (case
        insensitive: o termo é normalizado para caixa alta antes do LIKE)'
      parameters:
      - description: Prefixo do nome da skill
        in: query
        name: name
        type: string
      - description: Página
        in: query
        name: page
        type: integer
      - description: Limite
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PageableSkillDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Lista skills do catálogo
      tags:
      - skills
  /v1/skill/{id}:
    delete:
      description: Arquiva a skill marcando deleted_at e remove as associações skill_users
        dela (a skill some do perfil de todos os usuários). Somente moderadores e
        admins podem executar.
      parameters:
      - description: ID da skill
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Remove skill (soft delete)
      tags:
      - skills
    get:
      consumes:
      - application/json
      description: Retorna o detalhe da skill
      parameters:
      - description: ID da skill
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SkillDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Busca skill por id
      tags:
      - skills
    put:
      consumes:
      - application/json
      description: Atualiza o nome da skill (normalizado para caixa alta). Nome já
        usado por outra skill ativa gera conflito. Somente moderadores e admins podem
        executar.
      parameters:
      - description: ID da skill
        in: path
        name: id
        required: true
        type: string
      - description: Novo nome da skill
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateSkillDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.RegisterSkillDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Renomeia uma skill
      tags:
      - skills
  /v1/skill/{skillId}/users:
    post:
      consumes:
      - application/json
      description: 'Associa uma skill do catálogo a um usuário com um nível (WANT_TO_LEARN,
        LEARN_AND_TEACH ou TEACH). A linha é única por (skill, usuário): tentar associar
        de novo gera erro.'
      parameters:
      - description: ID da skill
        in: path
        name: skillId
        required: true
        type: string
      - description: Dados da associação
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.AssignSkillDto'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.SkillUserDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Adiciona skill ao perfil do usuário
      tags:
      - skill_users
  /v1/skill/register:
    post:
      consumes:
      - application/json
      description: Cria uma skill no catálogo. O nome é salvo em caixa alta (normalizado)
        e é único entre skills ativas.
      parameters:
      - description: Dados da skill
        in: body
        name: skill
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterSkillDto'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.RegisterSkillDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Registra uma nova skill
      tags:
      - skills
  /v1/user:
    get:
      consumes:
      - application/json
      description: 'Retorna usuários ativos com as skills do perfil, em ordem alfabética
        por nome. Filtros opcionais e combináveis (AND): skill (match exato do nome,
        normalizado para caixa alta, máx. 50), name (busca parcial, case-insensitive,
        ignora acentos) e email (match exato, case-insensitive). Sem filtros, retorna
        todos os usuários ativos paginados. O e-mail não é exposto no response.'
      parameters:
      - description: Nome da skill (match exato, normalizado para caixa alta, máx.
          50)
        in: query
        name: skill
        type: string
      - description: Nome do usuário (busca parcial, case-insensitive, ignora acentos)
        in: query
        name: name
        type: string
      - description: E-mail do usuário (match exato, case-insensitive)
        in: query
        name: email
        type: string
      - description: Página
        in: query
        name: page
        type: integer
      - description: Limite
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PageableUserDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Lista/busca usuários
      tags:
      - users
  /v1/user/{userId}:
    delete:
      description: Arquiva o usuário marcando deleted_at. Somente admins podem executar.
        O alvo não pode ser dono de comunidade/evento ativos nem ter participação
        ativa ou membership ativa.
      parameters:
      - description: ID do usuário
        in: path
        name: userId
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Remove usuário (soft delete)
      tags:
      - users
    get:
      description: Retorna id, name, description, email (quando visível) e configVisibility.
        O próprio usuário e ADMIN recebem o perfil completo; os demais recebem somente
        as entradas com shareWithCommunity=true e o email só se estiver compartilhado.
        A senha nunca é retornada.
      parameters:
      - description: ID do usuário
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserProfileDtoOut'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Busca o perfil de um usuário por id
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Atualiza nome, resumo (description) e a configuração de visibilidade
        (configVisibility) do perfil. E-mail e senha não são alteráveis por este endpoint;
        o value da chave email da configVisibility é gerenciado pelo sistema. Somente
        o próprio usuário (id do token) ou um admin podem executar.
      parameters:
      - description: ID do usuário
        in: path
        name: userId
        required: true
        type: string
      - description: Campos do perfil a alterar
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateUserDtoIn'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserDtoOut'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Altera o perfil de um usuário
      tags:
      - users
  /v1/user/{userId}/skills:
    get:
      consumes:
      - application/json
      description: Retorna as skills ativas do usuário (com nível), em ordem alfabética.
        Usuário válido sem skills retorna lista vazia.
      parameters:
      - description: ID do usuário
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.SkillUserDto'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Lista skills do perfil do usuário
      tags:
      - skill_users
  /v1/user/{userId}/skills/{skillId}:
    delete:
      consumes:
      - application/json
      description: Remove fisicamente a associação entre o usuário e a skill
      parameters:
      - description: ID do usuário
        in: path
        name: userId
        required: true
        type: string
      - description: ID da skill
        in: path
        name: skillId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Remove skill do perfil do usuário
      tags:
      - skill_users
  /v1/user/login:
    post:
      consumes:
      - application/json
      description: Realiza o login de um usuário e retorna um token JWT
      parameters:
      - description: Credenciais do usuário
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/dto.LoginUserDtoIn'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginUserDtoOut'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Autentica um usuário
      tags:
      - users
  /v1/user/register:
    post:
      consumes:
      - application/json
      description: Cria um novo usuário no sistema
      parameters:
      - description: Dados do usuário
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterUserDtoIn'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.UserDtoOut'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Registra um novo usuário
      tags:
      - users
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
